kind: pipeline
type: docker
name: 小助理

when:
  branch: master
  event: [ push, tag ]

workspace:
  base: /go
  path: src/keepblog


volumes:
  - name: gocache
    temp: { }

steps:
  - name: 测试与检查
    image: golang:1.24.11-bookworm
    volumes:
      - name: gocache
        path: /go/cache
    commands:
      - go env -w GOPROXY=https://goproxy.cn,direct
      - go vet ./...
      - go test -race -cover ./...
  - name: 构建前端
    image: node:20-bookworm
    commands:
      - corepack prepare pnpm@9.15.9 --activate
      - cd frontend
      - pnpm install --frozen-lockfile
      - pnpm build
      - cd ..
      # 同步产物到 static/console（保留 static.go），供后续 Go 编译 embed
      - find static/console -mindepth 1 -not -name "static.go" -delete 2>/dev/null || true
      - cp -r frontend/dist/. static/console/
  - name: 开始构建
    image: golang:1.24.11-bookworm
    volumes:
      - name: gocache
        path: /go/cache
    commands:
      - ls -la
      - go env -w GOPROXY=https://goproxy.cn,direct
      # 构建前端已在上一步骤完成，此处跳过前端构建
      - make linux SKIP_FRONTEND=1
  - name: 传输到服务器
    image: appleboy/drone-scp
    settings:
      host:
        from_secret: ssh_host
      key:
        from_secret: ssh_key
      username:
        from_secret: ssh_username
      port: 22
      source:
        - ./bin/keepblog-linux-amd64
      target:
        - /home/ubuntu/tmp
  - name: 部署
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: ssh_host
      key:
        from_secret: ssh_key
      username:
        from_secret: ssh_username
      port: 22
      script_stop: true
      script:
        # 兼容服务器上可能仍引用旧产物名 site 的 deploy.sh
        - cp /home/ubuntu/tmp/keepblog-linux-amd64 /home/ubuntu/tmp/site
        - chmod +x /home/ubuntu/tmp/deploy.sh
        - sh /home/ubuntu/tmp/deploy.sh
  #  - name: release
  #    image: plugins/gitee-release
  #    settings:
  #      api_key:
  #        from_secret: GITEE_TOKEN
  #      base_url: https://gitee.com/api/v5
  #      files:
  #        - bin/site
  #        - config.yaml
  #      node: "自动构建版本:${DRONE_TAG}"
  #      title: ${DRONE_TAG}
  #    when:
  #      event:
  #        - tag
  # 镜像推送（仅限 release 标签）
  - name: docker-push
    image: plugins/docker
    settings:
      repo: jieepre/keepblog
      dockerfile: ./Dockerfile
      purge: true
      insecure: false
      auto_tag: true
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    environment:
      HTTP_PROXY:
        from_secret: http_proxy  # HTTP代理地址
      HTTPS_PROXY:
        from_secret: http_proxy # HTTPS代理地址
    when:
      event: push
  # 添加 Gitee 状态通知（关键步骤）
  - name: notify-gitee
    image: plugins/git
    settings:
      gitee_token:
        from_secret: GITEE_TOKEN  # 需在 Drone 中配置此密钥
      context: drone-ci/build     # 在 Gitee 上显示的状态标题
      status: success             # 可选值: success/failure/pending
    when:
      status: [ success, failure ] # 仅在成功或失败时触发

