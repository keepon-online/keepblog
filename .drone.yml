kind: pipeline
type: docker
name: 小助理

trigger:
  branch:
    - master
  event:
    - push

steps:
  - name: 开始构建
    image: golang:1.21.4-bookworm
    commands:
      - ls -la
      - go env -w GOPROXY=https://goproxy.cn,direct
      - make linux
  - name: 传输到服务器
    image: appleboy/drone-scp
    settings:
      host:
        - 192.168.2.11
      username:
        from_secret: username
      password:
        from_secret: password
      port: 22
      source:
        - vehicle-tmp
      target:
        - /home/tcx/docker/tmp
  - name: 部署
    image: appleboy/drone-ssh
    settings:
      host:
        - 192.168.2.11
      username:
        from_secret: username
      password:
        from_secret: password
      port: 22
      script:
        - sh /home/tcx/docker/vehicle/deploy.sh
  - name: release
    image: plugins/gitea-release
    settings:
      api_key:
        from_secret: release_key
      base_url: https://git.tuochexia.cn
      files:
        - bin/vehicle
        - config.yaml
        - sql/*.sql
      node: vehicle
      title: vehicle
    when:
      event:
        - tag
  # 镜像推送（仅限 release 标签）
  - name: docker-push
    image: plugins/docker
    settings:
      repo: your-docker-registry/your-project
      dockerfile: Dockerfile
      auto_tag: true
      registry: docker.io  # 示例：docker.io
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      event: tag
      ref: refs/tags/release-*
  # 添加 Gitee 状态通知（关键步骤）
  - name: notify-gitee
    image: plugins/git
    settings:
      gitee_token:
        from_secret: GITEE_TOKEN  # 需在 Drone 中配置此密钥
      context: drone-ci/build     # 在 Gitee 上显示的状态标题
      status: success             # 可选值: success/failure/pending
    when:
      status: [ success, failure ] # 仅在成功或失败时触发

