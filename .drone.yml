kind: pipeline
type: docker
name: 小助理

when:
  branch: master
  event: [ push, tag ]

workspace:
  base: /go
  path: src/go-site


volumes:
  - name: gocache
    temp: { }

steps:
  - name: 开始构建
    image: golang:1.21.4-bookworm
    volumes:
      - name: gocache
        path: /go/cache
    commands:
      - ls -la
      - go env -w GOPROXY=https://goproxy.cn,direct
      - make linux
  - name: 传输到服务器
    image: appleboy/drone-scp
    settings:
      host:
        from_secret: ssh_host
      key:
        from_secret: ssh_key
      username:
        from_secret: ssh_username
      port: 22
      source:
        - ./bin/site
      target:
        - /home/ubuntu/tmp
  - name: 部署
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: ssh_host
      key:
        from_secret: ssh_key
      username:
        from_secret: ssh_username
      port: 22
      script_stop: true
      script:
        - chmod +x /home/ubuntu/tmp/deploy.sh
        - sh /home/ubuntu/tmp/deploy.sh
  #  - name: release
  #    image: plugins/gitee-release
  #    settings:
  #      api_key:
  #        from_secret: GITEE_TOKEN
  #      base_url: https://gitee.com/api/v5
  #      files:
  #        - bin/site
  #        - config.yaml
  #      node: "自动构建版本:${DRONE_TAG}"
  #      title: ${DRONE_TAG}
  #    when:
  #      event:
  #        - tag
  # 镜像推送（仅限 release 标签）
  - name: docker-push
    image: plugins/docker
    settings:
      repo: jieepre/site
      dockerfile: ./Dockerfile
      tag:
        - "{{ .Major }}.{{ .Minor }}.{{ .Patch }}" # 自动生成 v2.0.0
      auto_tag: true
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      event: tag
      ref: refs/tags/v[0-9]+.*  # 正则约束标签格式
  # 添加 Gitee 状态通知（关键步骤）
  - name: notify-gitee
    image: plugins/git
    settings:
      gitee_token:
        from_secret: GITEE_TOKEN  # 需在 Drone 中配置此密钥
      context: drone-ci/build     # 在 Gitee 上显示的状态标题
      status: success             # 可选值: success/failure/pending
    when:
      status: [ success, failure ] # 仅在成功或失败时触发

