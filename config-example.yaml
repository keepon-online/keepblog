http:
  port: 8589

# JWT 签发密钥（必填）。生产环境必须设置为随机值，可用：openssl rand -base64 32
# 也可通过环境变量 JWT_SECRET 提供。
jwt:
  secret: ""

# hashids 编码 salt（可选）。留空使用内置默认值；注意：更换 salt 会使
# 已发布文章的 URL 全部失效，除非你知道自己在做什么，否则不要修改。
hashids:
  salt: ""

# IP 归属库更新源（可选）。留空 = GitHub Release ipdb-latest（默认）。
# 国内服务器可指向自建镜像；回滚时指向 ipdb-v* 归档 Release 的资产直链。
# 镜像目录需同时提供 ip2region_v4.xdb 与 SHA256SUMS。
ipdb:
  updateUrl: ""

# 百度定时推送 方便收录
baidu:
  push: false
  url: https://www.example.com
  token: "your-baidu-push-token"

# IndexNow 主动收录推送（Bing/Yandex 等兼容搜索引擎）
# key 为 16-128 位十六进制/字母数字串，可用 openssl rand -hex 16 生成；
# 开启后本站自动在 /{key}.txt 提供密钥文件（协议要求），站点域名取 web_site.url。
indexnow:
  enable: false
  key: ""
  # endpoint: https://api.indexnow.org/indexnow  # 留空即用官方共享入口

# Redis配置
redis:
  host: localhost
  port: 6379
  password: ""
  database: 0
  enable: false

minio:
  serverUrl: http://127.0.0.1:9000
  endpoint: 127.0.0.1:9000
  accessKeyID: "your-access-key"
  secretAccessKey: "your-secret-key"
  useSSL: false
  bucketName: keepblog

# Artalk 自托管评论系统（部署见 docs/artalk-deploy.md）
# server 填 Artalk 后端地址（前端 JS/CSS 也从它加载，不依赖公共 CDN）；
# site 填站名，需与 Artalk 控制中心创建的站点名一致
artalk:
  enable: false
  server: "https://comment.example.com"
  site: "小助理"

# 后台 AI 辅助写作（OpenAI 兼容 Chat Completions 协议）
# baseURL 填服务根地址（客户端自动拼接 /chat/completions，勿带在末尾）：
#   GLM:        https://open.bigmodel.cn/api/paas/v4
#   GLM Coding: https://open.bigmodel.cn/api/coding/paas/v4
#   DeepSeek:   https://api.deepseek.com
#   本地 Ollama: http://127.0.0.1:11434/v1
# apiKey 为空时功能整体关闭，前端隐藏入口。
# maxTokens 单次生成上限；dailyQuota 每日调用配额（0=不限）；
# styleHint 注入 system 的文风设定；timeout 单次请求超时秒数（流式建议 ≥120）。
ai:
  baseURL: ""
  apiKey: ""
  model: "glm-5.3"
  maxTokens: 8192
  dailyQuota: 200
  styleHint: "技术博客，简洁准确，少废话"
  timeout: 120
  # 多模型切换（可选）：配置后 AI 菜单出现模型选择，请求按 name 路由；
  # baseURL/apiKey/maxTokens 缺省继承上方顶层配置
  #models:
  #  - name: "DeepSeek"
  #    model: deepseek-chat
  #    baseURL: https://api.deepseek.com
  #    apiKey: "your-ds-key"

# 文章发布通知（未配置则不启用）
# webhook 为通用 JSON POST（企业微信/钉钉/飞书机器人转接均可）；
# telegram 需 Bot Token 与 Chat ID（国内服务器可能无法直连，建议用 webhook）
notify:
  webhook: ""
  telegram:
    token: ""
    chatId: ""

