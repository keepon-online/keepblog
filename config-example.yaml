http:
  port: 8589

# JWT 签发密钥（必填）。生产环境必须设置为随机值，可用：openssl rand -base64 32
# 也可通过环境变量 JWT_SECRET 提供。
jwt:
  secret: ""

# hashids 编码 salt（可选）。留空使用内置默认值；注意：更换 salt 会使
# 已发布文章的 URL 全部失效，除非你知道自己在做什么，否则不要修改。
hashids:
  salt: ""

# 百度定时推送 方便收录
baidu:
  push: false
  url: https://www.example.com
  token: "your-baidu-push-token"

# Redis配置
redis:
  host: localhost
  port: 6379
  password: ""
  database: 0
  enable: false

minio:
  serverUrl: http://127.0.0.1:9000
  endpoint: 127.0.0.1:9000
  accessKeyID: "your-access-key"
  secretAccessKey: "your-secret-key"
  useSSL: false
  bucketName: keepblog

gitalk:
  enable: false
  clientID: "your-github-oauth-client-id"
  clientSecret: "your-github-oauth-client-secret"
  repo: "blog-comments"
  owner: "your-github-username"
  admin:
    - "your-github-username"
