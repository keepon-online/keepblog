<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统监控面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .card-title::before {
            content: "📊";
            margin-right: 8px;
            font-size: 1.2em;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .metric:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: #666;
        }
        
        .metric-value {
            font-weight: bold;
            color: #333;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #81C784);
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        
        .error {
            color: #f44336;
            text-align: center;
            padding: 20px;
            background: rgba(244, 67, 54, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }
        
        .realtime-data {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }
        
        .update-time {
            text-align: center;
            color: white;
            font-size: 0.9em;
            margin-top: 20px;
        }
        
        .network-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .network-table th,
        .network-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .network-table th {
            background: #f5f5f5;
            font-weight: bold;
        }
        
        .status-up {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .status-down {
            color: #f44336;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ 系统监控面板</h1>
            <p>实时监控系统运行状态</p>
        </div>
        
        <div id="loading" class="loading">
            正在加载系统信息...
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="dashboard" class="dashboard" style="display: none;">
            <!-- 系统基本信息 -->
            <div class="card">
                <div class="card-title">🖥️ 系统信息</div>
                <div id="general-info"></div>
            </div>
            
            <!-- CPU信息 -->
            <div class="card">
                <div class="card-title">⚡ CPU</div>
                <div id="cpu-info"></div>
                <div class="progress-bar">
                    <div id="cpu-progress" class="progress-fill" style="width: 0%;"></div>
                </div>
            </div>
            
            <!-- 内存信息 -->
            <div class="card">
                <div class="card-title">💾 内存</div>
                <div id="memory-info"></div>
                <div class="progress-bar">
                    <div id="memory-progress" class="progress-fill" style="width: 0%;"></div>
                </div>
            </div>
            
            <!-- 磁盘信息 -->
            <div class="card">
                <div class="card-title">💿 磁盘</div>
                <div id="disk-info"></div>
            </div>
            
            <!-- 网络信息 -->
            <div class="card">
                <div class="card-title">🌐 网络</div>
                <div id="network-info"></div>
            </div>
            
            <!-- 实时数据 -->
            <div class="card">
                <div class="card-title">📈 实时监控</div>
                <div id="realtime-info" class="realtime-data"></div>
            </div>
        </div>
        
        <div id="update-time" class="update-time"></div>
    </div>

    <script>
        let updateInterval;
        
        // API配置
        const API_BASE = '/api/monitor';
        
        // 格式化字节数
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // 格式化百分比
        function formatPercent(value) {
            return parseFloat(value).toFixed(1) + '%';
        }
        
        // 显示错误信息
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').innerHTML = `⚠️ ${message}`;
        }
        
        // 更新系统信息
        function updateSystemInfo() {
            fetch(`${API_BASE}/server`)
                .then(response => response.json())
                .then(data => {
                    if (data.code !== 200) {
                        throw new Error(data.message || '获取系统信息失败');
                    }
                    
                    const systemInfo = data.payload;
                    updateGeneralInfo(systemInfo.general);
                    updateCPUInfo(systemInfo.cpu);
                    updateMemoryInfo(systemInfo.memory);
                    updateDiskInfo(systemInfo.disk);
                    updateNetworkInfo(systemInfo.network);
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'grid';
                    
                    // 更新实时数据
                    updateRealtimeData();
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError(error.message);
                });
        }
        
        // 更新实时数据
        function updateRealtimeData() {
            fetch(`${API_BASE}/realtime`)
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        const stats = data.payload;
                        const realtimeDiv = document.getElementById('realtime-info');
                        realtimeDiv.innerHTML = `
                            <div class="metric">
                                <span class="metric-label">CPU使用率:</span>
                                <span class="metric-value">${formatPercent(stats.cpuPercent)}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">内存使用率:</span>
                                <span class="metric-value">${formatPercent(stats.memoryPercent)}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">磁盘使用率:</span>
                                <span class="metric-value">${formatPercent(stats.diskPercent)}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">网络入流量:</span>
                                <span class="metric-value">${formatBytes(stats.networkIn)}</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">网络出流量:</span>
                                <span class="metric-value">${formatBytes(stats.networkOut)}</span>
                            </div>
                        `;
                        
                        // 更新进度条
                        document.getElementById('cpu-progress').style.width = stats.cpuPercent + '%';
                        document.getElementById('memory-progress').style.width = stats.memoryPercent + '%';
                    }
                })
                .catch(error => {
                    console.error('Realtime data error:', error);
                });
        }
        
        // 更新基本信息
        function updateGeneralInfo(general) {
            const generalDiv = document.getElementById('general-info');
            generalDiv.innerHTML = `
                <div class="metric">
                    <span class="metric-label">主机名:</span>
                    <span class="metric-value">${general.hostname}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">操作系统:</span>
                    <span class="metric-value">${general.os}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">架构:</span>
                    <span class="metric-value">${general.arch}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">内核版本:</span>
                    <span class="metric-value">${general.kernel}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">运行时间:</span>
                    <span class="metric-value">${general.uptimeFormat}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">CPU核心数:</span>
                    <span class="metric-value">${general.cpuCores}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Go版本:</span>
                    <span class="metric-value">${general.goVersion}</span>
                </div>
            `;
        }
        
        // 更新CPU信息
        function updateCPUInfo(cpu) {
            const cpuDiv = document.getElementById('cpu-info');
            cpuDiv.innerHTML = `
                <div class="metric">
                    <span class="metric-label">使用率:</span>
                    <span class="metric-value">${formatPercent(cpu.usagePercent)}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">型号:</span>
                    <span class="metric-value">${cpu.modelName || 'Unknown'}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">频率:</span>
                    <span class="metric-value">${cpu.frequency ? cpu.frequency.toFixed(0) + ' MHz' : 'Unknown'}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">核心数:</span>
                    <span class="metric-value">${cpu.cores}</span>
                </div>
            `;
        }
        
        // 更新内存信息
        function updateMemoryInfo(memory) {
            const memoryDiv = document.getElementById('memory-info');
            memoryDiv.innerHTML = `
                <div class="metric">
                    <span class="metric-label">总内存:</span>
                    <span class="metric-value">${memory.totalFormat}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">已使用:</span>
                    <span class="metric-value">${memory.usedFormat}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">空闲:</span>
                    <span class="metric-value">${memory.freeFormat}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">使用率:</span>
                    <span class="metric-value">${formatPercent(memory.usedPercent)}</span>
                </div>
            `;
        }
        
        // 更新磁盘信息
        function updateDiskInfo(disks) {
            const diskDiv = document.getElementById('disk-info');
            let html = '';
            
            disks.forEach(disk => {
                html += `
                    <div style="margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px;">
                        <div class="metric">
                            <span class="metric-label">设备:</span>
                            <span class="metric-value">${disk.device}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">挂载点:</span>
                            <span class="metric-value">${disk.mountpoint}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">类型:</span>
                            <span class="metric-value">${disk.fstype}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">总容量:</span>
                            <span class="metric-value">${disk.totalFormat}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">已使用:</span>
                            <span class="metric-value">${disk.usedFormat}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">使用率:</span>
                            <span class="metric-value">${formatPercent(disk.usedPercent)}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${disk.usedPercent}%;"></div>
                        </div>
                    </div>
                `;
            });
            
            diskDiv.innerHTML = html;
        }
        
        // 更新网络信息
        function updateNetworkInfo(networks) {
            const networkDiv = document.getElementById('network-info');
            let html = '<table class="network-table"><thead><tr><th>接口</th><th>状态</th><th>接收</th><th>发送</th></tr></thead><tbody>';
            
            networks.forEach(net => {
                html += `
                    <tr>
                        <td>${net.name}</td>
                        <td class="${net.isUp ? 'status-up' : 'status-down'}">${net.isUp ? '在线' : '离线'}</td>
                        <td>${net.recvFormat}</td>
                        <td>${net.sentFormat}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            networkDiv.innerHTML = html;
        }
        
        // 初始化
        function init() {
            updateSystemInfo();
            
            // 设置定时更新实时数据
            updateInterval = setInterval(() => {
                updateRealtimeData();
                document.getElementById('update-time').innerHTML = `最后更新: ${new Date().toLocaleString()}`;
            }, 5000); // 每5秒更新一次
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
        
        // 页面卸载时清除定时器
        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
</html>
