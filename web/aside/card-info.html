<div class="card-widget card-info">
    <div class="is-center">
        <div class="avatar-img">
            <img alt="avatar"  src="https://i.loli.net/2021/02/24/5O1day2nriDzjSu.png"/>
        </div>
        <div class="author-info__name">{{.site.Title}}</div>
        <div class="author-info__description"></div>
    </div>
    <div class="card-info-data site-data is-center"><a href="/archives/">
        <div class="headline">文章</div>
        <div class="length-num">{{ .cardInfo.Post}}</div>
    </a><a href="/tags/">
        <div class="headline">标签</div>
        <div class="length-num">{{ .cardInfo.Tag}}</div>
    </a><a href="/categories/">
        <div class="headline">分类</div>
        <div class="length-num">{{ .cardInfo.Category}}</div>
    </a></div>
    <a href="{{.site.Github}}" id="card-info-btn" rel="noopener" target="_blank">
        <i class="fab fa-github"></i><span>Follow Me</span></a>
    <div class="card-info-social-icons is-center">
        {{if .site.Github}}
        <a class="social-icon" href="{{.site.Github}}" target="_blank" title="Github">
            <i class="fab fa-github"></i></a>
        {{end}}
        <a class="social-icon" href="mailto:jieepre@outlook.com" target="_blank" title="Email">
        <i class="fas fa-envelope"></i></a>
    </div>
</div>
