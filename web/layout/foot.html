{{define "layout/foot.html" }}
<div id="rightside">
    <div id="rightside-config-hide">
        <button id="darkmode" title="浅色和深色模式转换" type="button"><i class="fas fa-adjust"></i></button>
        <button id="hide-aside-btn" title="单栏和双栏切换" type="button"><i class="fas fa-arrows-alt-h"></i></button>
    </div>
    <div id="rightside-config-show">
        <button id="rightside_config" title="设置" type="button"><i class="fas fa-cog fa-spin"></i></button>
        <button id="go-up" title="回到顶部" type="button"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>
<div id="local-search">
    <div class="search-dialog" style="display: none; animation: 0.5s ease 0s 1 normal none running titleScale;">
        <nav class="search-nav"><span class="search-dialog-title">搜寻</span>
            <span id="loading-status"></span>
            <button class="search-close-button"><i class="fas fa-times"></i></button>
        </nav>
        <div class="search-wrap" style="display: block;">
            <div id="local-search-input">
                <div class="local-search-box">
                    <input class="local-search-box--input" placeholder="搜寻文章" type="text">
                </div>
            </div>
            <hr>
            <div class="no-result" id="local-search-results">

            </div>
            <div id="local-search-stats-wrap">
                <hr>
                <div class="search-result-stats">共找到 14 篇文章</div>
            </div>
        </div>
    </div>
    <div id="search-mask" style="display: none; animation: 0.5s ease 0s 1 normal none running to_show;">
    </div>
</div>
<div>
    <script src="/js/search.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/main.js"></script>
    <div class="js-pjax"></div>
    <div class="aplayer no-destroy" id="player"></div>
    <canvas class="fireworks" mobile="false"></canvas>
    <script src="/plugins/butterfly-extsrc/dist/fireworks.min.js"></script>
    <script src="/plugins/butterfly-extsrc/dist/activate-power-mode.min.js"></script>
    <script>
        POWERMODE.colorful = true;
        POWERMODE.shake = true;
        POWERMODE.mobile = false;
        document.body.addEventListener('input', POWERMODE);
    </script>
    <link href="/plugins/aplayer/dist/APlayer.min.css" media="print" onload="this.media='all'" rel="stylesheet">
    <script src="/plugins/aplayer/dist/APlayer.min.js"></script>
    <script src="/plugins/pjax/pjax.min.js"></script>
    <script>
        // 全局保存播放器实例
        let ap = null;
        document.addEventListener('DOMContentLoaded', function () {
            // 初始化播放器（仅首次加载）
            if (!ap) {
                ap = new APlayer({
                    container: document.getElementById('player'),
                    fixed: true,
                    autoplay: true,
                    theme: '#b7daff',
                    loop: 'all',
                    order: 'random',
                    preload: 'auto',
                    lrcType: 0,
                    volume: 0.5,
                    mutex: true,
                    listFolded: false,
                    storageName: 'aplayer-setting',
                    audio: [{
                        name: '平凡之路',
                        artist: '平凡之路',
                        url: 'http://music.163.com/song/media/outer/url?id=1497917991.mp3',
                        cover: 'http://p2.music.126.net/IwEI0tFPh4w9OjY6RM2IJQ==/109951163009071893.jpg?param=90y90',
                        type: 'auto'
                    }]
                });
                // 恢复播放状态
                const savedState = localStorage.getItem('musicState');
                if (savedState === 'playing') {
                    ap.play();
                }
            }
            // 初始化 PJAX
            const pjax = new Pjax({
                selectors: ["head > title","#config-diff","#body-wrap","#rightside-config-hide","#rightside-config-show",".js-pjax"], // 仅替换这个容器的内容
                cacheBust: false
            });

            // PJAX 加载完成后保持播放器状态
            document.addEventListener('pjax:success', function () {
                if (ap && ap.audio.paused && localStorage.getItem('musicState') === 'playing') {
                    ap.play();
                }
            });
        });

    </script>
    {{if BaiduStat .site.BaiduStat}}
    <script>
        var _hmt = _hmt || [];
        (function () {
            const hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?{{.site.BaiduStat}}";
            const s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    {{end}}
</div>
{{end}}
