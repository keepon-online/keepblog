<div class="card-widget" id="card-toc">
    <div class="item-headline">
        <i class="fas fa-stream"></i>
        <span>目录</span>
        <span class="toc-percentage"></span>
    </div>
    <div class="toc-content is-expand">
        {{.toc | unescaped}}
    </div>
</div>
<script>
    // 用 IIFE 包裹避免 let/const 成为全局声明：此脚本带 data-pjax 区域，
    // PJAX 切换页面时会重新执行，裸 let/const 会因重复声明抛 SyntaxError。
    ;(function () {
        var tocBox = document.getElementById("card-toc");
        if (!tocBox) return;
        var $ol = tocBox.querySelectorAll("ol");
        for (var i = 0; i < $ol.length; i++) {
            if (i === 0) { $ol.item(i).classList.add("toc") }
            else { $ol.item(i).classList.add("toc-child") }
        }
        var $li = tocBox.querySelectorAll("li");
        for (var i = 0; i < $li.length; i++) { $li.item(i).classList.add("toc-item") }
        var $a = tocBox.querySelectorAll("a");
        for (var i = 0; i < $a.length; i++) { $a.item(i).classList.add("toc-link") }
    })();
</script>
