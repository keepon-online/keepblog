<div class="card-widget card-categories">
    <div class="item-headline">
        <i class="fas fa-folder-open"></i>
        <span>分类</span>

    </div>
    <ul class="card-category-list" id="aside-cat-list">
        {{range $i, $v := .categories}}
        <li class="card-category-list-item ">
            <a class="card-category-list-link" href="/categories/{{ $v.CategoryName }}">
                <span class="card-category-list-name">{{$v.CategoryName}}</span>
                <span class="card-category-list-count">{{$v.Total}}</span>
            </a>
        </li>
        {{end}}
    </ul>
</div>
