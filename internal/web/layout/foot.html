{{define "layout/foot.html" }}
<div id="rightside">
    <div id="rightside-config-hide">
        <button id="darkmode" title="浅色和深色模式转换" type="button"><i class="fas fa-adjust"></i></button>
        <button id="hide-aside-btn" title="单栏和双栏切换" type="button"><i class="fas fa-arrows-alt-h"></i></button>
    </div>
    <div id="rightside-config-show">
        <button id="rightside_config" title="设置" type="button"><i class="fas fa-cog fa-spin"></i></button>
        <button id="go-up" title="回到顶部" type="button"><i class="fas fa-arrow-up"></i></button>
    </div>
</div>
<div id="local-search">
    <div class="search-dialog" style="display: none; animation: 0.5s ease 0s 1 normal none running titleScale;">
        <nav class="search-nav">
            <span class="search-dialog-title"><i class="fas fa-search"></i> 搜索文章</span>
            <span id="loading-status"></span>
            <button class="search-close-button" type="button" title="关闭 (ESC)"><i class="fas fa-times"></i></button>
        </nav>
        <div class="search-wrap" style="display: block;">
            <div id="local-search-input">
                <div class="local-search-box">
                    <i class="fas fa-search search-box-icon"></i>
                    <input class="local-search-box--input" placeholder="输入关键词搜索全站文章..." type="text" autocomplete="off" spellcheck="false">
                    <button class="search-box-clear" type="button" title="清空" style="display: none;"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="search-divider"></div>
            <div class="no-result" id="local-search-results">

            </div>
            <div id="local-search-stats-wrap" class="search-dialog-footer">
                <div class="search-shortcuts">
                    <span class="search-shortcut-item"><kbd>↑</kbd><kbd>↓</kbd> 导航</span>
                    <span class="search-shortcut-item"><kbd>↵</kbd> 选择</span>
                    <span class="search-shortcut-item"><kbd>ESC</kbd> 关闭</span>
                </div>
                <div class="search-result-stats"></div>
            </div>
        </div>
    </div>
    <div id="search-mask" style="display: none; animation: 0.5s ease 0s 1 normal none running to_show;">
    </div>
</div>
<div>
    <script src="/js/search.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/code-copy.js"></script>
    <script src="/js/reading-progress.js"></script>
    <div class="js-pjax"></div>
    <div class="aplayer no-destroy" id="player"></div>
    <canvas class="fireworks" mobile="false"></canvas>
    <script defer src="/plugins/butterfly-extsrc/dist/fireworks.min.js"></script>
    <script defer src="/plugins/butterfly-extsrc/dist/activate-power-mode.min.js"></script>
    <script>
        // defer 脚本在 DOMContentLoaded 前按序执行，故在回调内 POWERMODE 必然已定义。
        document.addEventListener('DOMContentLoaded', function () {
            POWERMODE.colorful = true;
            POWERMODE.shake = true;
            POWERMODE.mobile = false;
            document.body.addEventListener('input', POWERMODE);
        });
    </script>
    <!-- NProgress 进度条 -->
    <link href="/plugins/nprogress/nprogress.min.css" rel="stylesheet">
    <script src="/plugins/nprogress/nprogress.min.js"></script>
    <!-- APlayer 音乐播放器 -->
    <link href="/plugins/aplayer/dist/APlayer.min.css" media="print" onload="this.media='all'" rel="stylesheet">
    <script src="/plugins/aplayer/dist/APlayer.min.js"></script>
    <!-- PJAX 无刷新加载 -->
    <script src="/plugins/pjax/pjax.min.js"></script>
    <!-- PJAX + 音乐播放器管理模块 -->
    <script src="/js/pjax-music.js"></script>
    <script>
        // IIFE 包裹：避免 PJAX 重新执行时 let/const 重复声明崩溃。
        ;(function () {
            // 播放器基础配置（fetch 成功/失败共用）
            var playerConfig = {
                container: document.getElementById('player'),
                fixed: true,
                autoplay: false,
                theme: '#b7daff',
                loop: 'all',
                order: 'random',
                preload: 'auto',
                lrcType: 0,
                volume: 0.5,
                mutex: true,
                listFolded: true,
                storageName: 'aplayer-setting'
            };

            // 从后台获取音乐列表；默认音乐已在后端种子数据中，不再前端硬编码。
            fetch('/api/music/list')
                .then(function (res) { return res.json() })
                .then(function (data) {
                    var opts = Object.assign({}, playerConfig);
                    if (data.code === 200 && data.data && data.data.length > 0) {
                        opts.audio = data.data.map(function (item) {
                            return {
                                name: item.name || '未知歌曲',
                                artist: item.artist || '未知艺术家',
                                url: item.url,
                                cover: item.cover || '',
                                lrc: item.lrc || '',
                                type: 'auto'
                            };
                        });
                    }
                    // 后台无数据时 opts.audio 为 undefined，MusicPlayer.init 会用内置兜底。
                    window.initPjaxMusic(opts);
                })
                .catch(function (err) {
                    console.warn('[Music] 获取音乐列表失败，使用内置兜底:', err);
                    // API 彻底失败时不传 audio，由 pjax-music.js 的内置兜底接管。
                    window.initPjaxMusic(playerConfig);
                });
        })();
    </script>
    {{if BaiduStat .site.BaiduStat}}
    <script>
        var _hmt = _hmt || [];
        (function () {
            const hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?{{.site.BaiduStat}}";
            const s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
    {{end}}
</div>
{{end}}
