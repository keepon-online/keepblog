{{define "layout/head.html"}}
<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>{{.site.Title}}</title>
    <meta content="{{.site.Title}}" name="author">
    <meta content="{{.site.Title}}" name="copyright">
    <meta content="telephone=no" name="format-detection">
    <meta content="#ffffff" name="theme-color">
    <meta content="website" property="og:type">
    <meta content="{{.site.Keywords}}" name="keywords">
    <meta content="{{.site.Description}}" name="description">
    <meta content="{{.site.URL}}" property="og:url">
    <meta content="{{.site.Title}}" property="og:site_name">
    <meta content="zh_CN" property="og:locale">
    <meta content="{{.site.Title}}" property="article:author">
    <meta content="summary" name="twitter:card">
    {{if  .site.BaiduSite}}
    <meta content="{{ .site.BaiduSite }}" name="baidu-site-verification" />
    {{end}}
    <link href="/favicon.ico" rel="shortcut icon">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/plugins/@fortawesome/fontawesome-free/css/all.min.css" media="print" onload="this.media='all'" rel="stylesheet">

    <script src="/js/global-config.js"></script>
    <script data-pjax id="config-diff">
        const GLOBAL_CONFIG_SITE = {
            title: '小助理',
            isPost: false,
            isHome: true,
            isHighlightShrink: true,
            isToc: false,
            postUpdate: '2022-06-16 21:01:04'
        };
    </script>
    <noscript>
        <style type="text/css">
            #nav {
                opacity: 1
            }

            .justified-gallery img {
                opacity: 1
            }

            #recent-posts time,
            #post-meta time {
                display: inline !important
            }
        </style>
    </noscript>
    <script>
        (win => {
            win.saveToLocal = {
                set: function setWithExpiry(key, value, ttl) {
                    if (ttl === 0) return
                    const now = new Date()
                    const expiryDay = ttl * 86400000
                    const item = {
                        value: value,
                        expiry: now.getTime() + expiryDay,
                    }
                    localStorage.setItem(key, JSON.stringify(item))
                },

                get: function getWithExpiry(key) {
                    const itemStr = localStorage.getItem(key)

                    if (!itemStr) {
                        return undefined
                    }
                    const item = JSON.parse(itemStr)
                    const now = new Date()

                    if (now.getTime() > item.expiry) {
                        localStorage.removeItem(key)
                        return undefined
                    }
                    return item.value
                }
            }

            win.getScript = url => new Promise((resolve, reject) => {
                const script = document.createElement('script')
                script.src = url
                script.async = true
                script.onerror = reject
                script.onload = script.onreadystatechange = function () {
                    const loadState = this.readyState
                    if (loadState && loadState !== 'loaded' && loadState !== 'complete') return
                    script.onload = script.onreadystatechange = null
                    resolve()
                }
                document.head.appendChild(script)
            })

            win.activateDarkMode = function () {
                document.documentElement.setAttribute('data-theme', 'dark')
                if (document.querySelector('meta[name="theme-color"]') !== null) {
                    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d0d0d')
                }
            }
            win.activateLightMode = function () {
                document.documentElement.setAttribute('data-theme', 'light')
                if (document.querySelector('meta[name="theme-color"]') !== null) {
                    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff')
                }
            }
            const t = saveToLocal.get('theme')

            if (t === 'dark') activateDarkMode()
            else if (t === 'light') activateLightMode()

            const asideStatus = saveToLocal.get('aside-status')
            if (asideStatus !== undefined) {
                if (asideStatus === 'hide') {
                    document.documentElement.classList.add('hide-aside')
                } else {
                    document.documentElement.classList.remove('hide-aside')
                }
            }

            const detectApple = () => {
                if (/iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent)) {
                    document.documentElement.classList.add('apple')
                }
            }
            detectApple()
        })(window)
    </script>
</head>
{{end}}
