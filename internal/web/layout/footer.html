{{define "layout/footer.html"}}
<footer id="footer">
    <div class="waves-area">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use href="#gentle-wave" xlink:href="#gentle-wave" x="48" y="0" />
                <use href="#gentle-wave" xlink:href="#gentle-wave" x="48" y="3" />
                <use href="#gentle-wave" xlink:href="#gentle-wave" x="48" y="5" />
                <use href="#gentle-wave" xlink:href="#gentle-wave" x="48" y="7" />
            </g>
        </svg>
    </div>
    <div id="footer-wrap">
        <div class="copyright">{{.site.Copyright}}</div>
        <div class="footer_custom_text">
            {{if .site.Icp}}
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">
                <img class="icp-icon" src="/images/beian.png"><span>{{.site.Icp}}</span>
            </a>
            {{end}}
        </div>
    </div>
</footer>

{{end}}
